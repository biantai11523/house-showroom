<main><header><small>华林 · 2 号楼 1402</small><a href="../../">打开三维展示 ↗</a></header><h1>榫与弧</h1><p class="lead">黑胡桃、墨褐皮和原色亚麻。室内画面由 Blender 实景渲染，动线图取自同一模型。</p><nav><a href="#coffee-bar">餐边咖啡区</a><a href="#evening">夜间灯光</a><a href="#chair">椅子构造</a><a href="#house">全屋布局</a></nav><figure id="living"><img src="living.jpg" width="1600" height="1039" alt="客厅 · 上午九点半" loading="eager"><figcaption><h2>客厅 · 上午九点半</h2><p>墨褐皮双座、鞍皮弯木椅与薄纱后的南窗。</p></figcaption></figure><figure id="coffee-bar"><img src="coffee-bar.jpg" width="1512" height="1022" alt="餐边咖啡区" loading="lazy"><figcaption><h2>餐边咖啡区</h2><p>咖啡机在靠厨房的一端。胡桃木层板收杯，拉丝钢托板接住咖啡粉和水滴。</p></figcaption></figure><figure id="coffee-plan"><img src="coffee-plan.jpg" width="1120" height="920" alt="咖啡区位置与动线" loading="lazy"><figcaption><h2>咖啡区位置与动线</h2><p>根据当前模型绘制。使用咖啡机与水槽的两个站位相距约 2.1 米。</p></figcaption></figure><figure id="espresso"><img src="espresso.jpg" width="1512" height="1057" alt="咖啡机与豆仓" loading="lazy"><figcaption><h2>咖啡机与豆仓</h2><p>从磨豆机到压粉垫、冲煮头，手柄前方留出操作空间。</p></figcaption></figure><figure id="dining"><img src="dining.jpg" width="1512" height="982" alt="餐厨与双拱餐桌" loading="lazy"><figcaption><h2>餐厨与双拱餐桌</h2><p>餐边柜兼作咖啡台。三层反光吊灯照亮桌面，北侧衔接 U 形厨房。</p></figcaption></figure><figure id="evening"><img src="evening.jpg" width="1512" height="982" alt="客厅 · 晚上八点" loading="lazy"><figcaption><h2>客厅 · 晚上八点</h2><p>与日景相同的机位。壁灯与台灯照亮坐席，顶边灯槽勾出房间的轮廓。</p></figcaption></figure><figure id="chair"><img src="chair.jpg" width="1600" height="729" alt="弯木休闲椅" loading="lazy"><figcaption><h2>弯木休闲椅</h2><p>同一把椅子的正侧、侧面与背面。最右侧用灰模显示吊座和横档。</p></figcaption></figure><figure id="house"><img src="house.jpg" width="1600" height="1230" alt="完整墙体鸟瞰" loading="lazy"><figcaption><h2>完整墙体鸟瞰</h2><p>按原始家具布局图重建。户内人字拼从同一角起铺，电梯厅单列为公区。</p></figcaption></figure><figure id="bedroom"><img src="bedroom.jpg" width="1512" height="995" alt="主卧" loading="lazy"><figcaption><h2>主卧</h2><p>藤编床头、烟草褐床毯与落地亚麻帘。</p></figcaption></figure><figure id="study"><img src="study.jpg" width="1512" height="995" alt="双人书房" loading="lazy"><figcaption><h2>双人书房</h2><p>两套独立工位共用长桌，对面是整面开放书架。</p></figcaption></figure><figure id="entrance"><img src="entrance.jpg" width="1512" height="1163" alt="玄关借光" loading="lazy"><figcaption><h2>玄关借光</h2><p>换鞋凳背后的拱形玻璃连通玄关和客厅的光线。</p></figcaption></figure><footer>户型依据为用户布局图。层高、门窗和朝向采用设计假设，尺寸待现场复核。</footer></main></html>
