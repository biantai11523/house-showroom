<style>*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#38312b;font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:24px clamp(16px,4vw,52px) 56px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4ccc0;padding-bottom:16px}header small{letter-spacing:.08em;color:#685a50}a{color:#4b352a;text-decoration:none;border-bottom:1px solid #8a7361}h1{font-size:clamp(30px,5vw,54px);font-weight:500;margin:28px 0 6px;letter-spacing:.08em}.lead{margin:0 0 24px;color:#665a50}nav{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 26px}figure{margin:0 0 42px}figure>a{display:block;border:0;cursor:zoom-in}img{width:100%;height:auto;display:block;background:#e3ddd1}figcaption{padding:10px 0;border-bottom:1px solid #d6cdc0}h2{font-size:19px;font-weight:550;margin:0}p{margin:.25em 0 .5em}footer{color:#74695f;font-size:13px}</style>
<main><header><small>华林 · 2 号楼 1402</small><a href="../../">打开三维展示 ↗</a></header><h1>榫与弧</h1><p class="lead">黑胡桃、墨褐皮和原色亚麻。室内画面由 Blender 实景渲染，动线图取自同一模型。</p><nav><a href="#coffee-bar">餐边咖啡区</a><a href="#evening">夜间灯光</a><a href="#chair">椅子构造</a><a href="#house">全屋布局</a><a href="#child-wardrobe">儿童房衣柜</a></nav><figure id="living"><a href="living-full.jpg?v=9488a6c24739" aria-label="放大查看客厅 · 上午九点半"><img src="living.jpg?v=9488a6c24739" srcset="living-small.jpg?v=9488a6c24739 800w, living.jpg?v=9488a6c24739 1600w, living-full.jpg?v=9488a6c24739 2560w" sizes="(max-width: 1100px) 92vw, 1000px" width="2560" height="1662" alt="客厅 · 上午九点半" loading="eager"></a><figcaption><h2>客厅 · 上午九点半</h2><p>墨褐皮双座、鞍皮弯木椅与薄纱后的南窗。</p></figcaption></figure><figure id="coffee-bar"><a href="coffee-bar-full.jpg?v=9488a6c24739" aria-label="放大查看餐边咖啡区"><img src="coffee-bar.jpg?v=9488a6c24739" srcset="coffee-bar-small.jpg?v=9488a6c24739 800w, coffee-bar.jpg?v=9488a6c24739 1600w, coffee-bar-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1622" alt="餐边咖啡区" loading="lazy"></a><figcaption><h2>餐边咖啡区</h2><p>咖啡机在靠厨房的一端。胡桃木层板收杯，拉丝钢托板接住咖啡粉和水滴。</p></figcaption></figure><figure id="coffee-plan"><a href="coffee-plan.jpg?v=9488a6c24739" aria-label="放大查看咖啡区位置与动线"><img src="coffee-plan.jpg?v=9488a6c24739" srcset="coffee-plan-small.jpg?v=9488a6c24739 800w, coffee-plan.jpg?v=9488a6c24739 1120w" sizes="(max-width: 1100px) 92vw, 1000px" width="1120" height="920" alt="咖啡区位置与动线" loading="lazy"></a><figcaption><h2>咖啡区位置与动线</h2><p>根据当前模型绘制。使用咖啡机与水槽的两个站位相距约 2.1 米。</p></figcaption></figure><figure id="espresso"><a href="espresso-full.jpg?v=9488a6c24739" aria-label="放大查看咖啡机与豆仓"><img src="espresso.jpg?v=9488a6c24739" srcset="espresso-small.jpg?v=9488a6c24739 800w, espresso.jpg?v=9488a6c24739 1600w, espresso-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1678" alt="咖啡机与豆仓" loading="lazy"></a><figcaption><h2>咖啡机与豆仓</h2><p>从磨豆机到压粉垫、冲煮头，手柄前方留出操作空间。</p></figcaption></figure><figure id="dining"><a href="dining-full.jpg?v=9488a6c24739" aria-label="放大查看餐厨与双拱餐桌"><img src="dining.jpg?v=9488a6c24739" srcset="dining-small.jpg?v=9488a6c24739 800w, dining.jpg?v=9488a6c24739 1600w, dining-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1558" alt="餐厨与双拱餐桌" loading="lazy"></a><figcaption><h2>餐厨与双拱餐桌</h2><p>餐边柜兼作咖啡台。三层反光吊灯照亮桌面，北侧衔接 U 形厨房。</p></figcaption></figure><figure id="evening"><a href="evening-full.jpg?v=9488a6c24739" aria-label="放大查看客厅 · 晚上八点"><img src="evening.jpg?v=9488a6c24739" srcset="evening-small.jpg?v=9488a6c24739 800w, evening.jpg?v=9488a6c24739 1600w, evening-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1558" alt="客厅 · 晚上八点" loading="lazy"></a><figcaption><h2>客厅 · 晚上八点</h2><p>与日景相同的机位。壁灯与台灯照亮坐席，顶边灯槽勾出房间的轮廓。</p></figcaption></figure><figure id="chair"><a href="chair-full.jpg?v=9488a6c24739" aria-label="放大查看弯木休闲椅"><img src="chair.jpg?v=9488a6c24739" srcset="chair-small.jpg?v=9488a6c24739 800w, chair.jpg?v=9488a6c24739 1600w, chair-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1093" alt="弯木休闲椅" loading="lazy"></a><figcaption><h2>弯木休闲椅</h2><p>同一把椅子的正侧、侧面与背面。最右侧用灰模显示吊座和横档。</p></figcaption></figure><figure id="house"><a href="house-full.jpg?v=9488a6c24739" aria-label="放大查看完整墙体鸟瞰"><img src="house.jpg?v=9488a6c24739" srcset="house-small.jpg?v=9488a6c24739 800w, house.jpg?v=9488a6c24739 1600w, house-full.jpg?v=9488a6c24739 2560w" sizes="(max-width: 1100px) 92vw, 1000px" width="2560" height="1969" alt="完整墙体鸟瞰" loading="lazy"></a><figcaption><h2>完整墙体鸟瞰</h2><p>按原始家具布局图重建。户内人字拼从同一角起铺，电梯厅单列为公区。</p></figcaption></figure><figure id="bedroom"><a href="bedroom-full.jpg?v=9488a6c24739" aria-label="放大查看主卧"><img src="bedroom.jpg?v=9488a6c24739" srcset="bedroom-small.jpg?v=9488a6c24739 800w, bedroom.jpg?v=9488a6c24739 1600w, bedroom-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1579" alt="主卧" loading="lazy"></a><figcaption><h2>主卧</h2><p>藤编床头、烟草褐床毯与落地亚麻帘。</p></figcaption></figure><figure id="child-wardrobe"><a href="child-wardrobe-full.jpg?v=9488a6c24739" aria-label="放大查看儿童房 · 胡桃木衣柜"><img src="child-wardrobe.jpg?v=9488a6c24739" srcset="child-wardrobe-small.jpg?v=9488a6c24739 800w, child-wardrobe.jpg?v=9488a6c24739 1600w, child-wardrobe-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1714" alt="儿童房 · 胡桃木衣柜" loading="lazy"></a><figcaption><h2>儿童房 · 胡桃木衣柜</h2><p>三扇门板采用与长辈房衣柜相同的油蜡黑胡桃。竖纹沿门板贯通，搭配短铜执手。</p></figcaption></figure><figure id="study"><a href="study-full.jpg?v=9488a6c24739" aria-label="放大查看双人书房"><img src="study.jpg?v=9488a6c24739" srcset="study-small.jpg?v=9488a6c24739 800w, study.jpg?v=9488a6c24739 1600w, study-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1579" alt="双人书房" loading="lazy"></a><figcaption><h2>双人书房</h2><p>两套独立工位共用长桌，对面是整面开放书架。</p></figcaption></figure><figure id="entrance"><a href="entrance-full.jpg?v=9488a6c24739" aria-label="放大查看玄关借光"><img src="entrance.jpg?v=9488a6c24739" srcset="entrance-small.jpg?v=9488a6c24739 800w, entrance.jpg?v=9488a6c24739 1600w, entrance-full.jpg?v=9488a6c24739 2400w" sizes="(max-width: 1100px) 92vw, 1000px" width="2400" height="1846" alt="玄关借光" loading="lazy"></a><figcaption><h2>玄关借光</h2><p>换鞋凳背后的拱形玻璃连通玄关和客厅的光线。</p></figcaption></figure><footer>户型依据为用户布局图。层高、门窗和朝向采用设计假设，尺寸待现场复核。</footer></main></html>
